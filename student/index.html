<script>

    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;

<!--
  ─────────────────────────────────────────────────────────────
  디자인 브리프 (일반 웹사이트 지침 V1.6 §2.1)
  페이지 유형     자료 모음형 Hub (보조: 정보형)
  한 줄 콘셉트    선생님이 말한 실험을 10초 안에 찾아 여는 교과서 목차
  첫 화면의 주인공 단원 목차와 실험 목록 자체 — 제목은 길잡이일 뿐이다
  핵심 행동       실험 하나를 여는 것
  정보 흐름       단원 고르기 또는 검색 → 실험 훑기 → 열기
  레이아웃 전략   Index + list (보조: search + filter)
  내비게이션      좌측 목차 레일 → 760px 미만에서 학년·단원 가로 칩
  팔레트          교과서 종이와 잉크 — 푸른 기 도는 회백 종이 · 잉크 남색 · 브랜드 블루 1색(선택·행동) · 상태색 3
  타이포          1 family Pretendard Variable. 제목 800 (1단계 탈락 — 주인공은 목록) · 설명문 Pretendard
                  굵기 400/500/600/800, 크기 12/13/15/18 + 제목 clamp(22,…,28)
  시그니처        L4 데이터 "과학 영역 색 아이콘" — 실험마다 내용을 그린 아이콘을 물리·화학·생명·지구 영역 색 타일에 담고,
                  목차 점 · 단원 번호 · 실험 타일이 같은 영역 색으로 이어진다 (색은 교과 영역에서 나온다, §6.1)
                  보조(상호작용) — 교사용에서 거른 목록·단원을 QR 한 장으로 학생용에 같은 상태 + "선생님이 보낸 목록"으로 연다
  표면·밀도 규칙  무광 종이 위의 흰 실험 타일(반복 객체라 카드 허용, §6.3) — 그림자 없이 hairline. 떠 있는 것은 QR 창 하나
                  목차·머리·도구 열은 카드로 감싸지 않는다
  기본 테마       라이트(두 페이지 공통, 사용자 지정) — 다크 전환 가능, 저장 키 ssw-theme
  규칙 이탈       워드마크 13px/700 — §14 규격 · 채널 아이콘은 공식 색 아이콘(사용자 지정, 새 창 표시는 이름·툴팁으로)
  이번 금지       중앙 hero + 카드 3열 / 장식용 분자·원자 배경 / 카드 hover lift·글로우
  ─────────────────────────────────────────────────────────────
-->

<style>
/* ══ 토큰 — 두 테마가 같은 목록을 빠짐없이 갖는다 (§6.5-5 ②). 색은 이 두 블록에서만 정의한다 ══ */
:root{
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-title:var(--font-ui);      /* 제목 = Pretendard 800 — 선정 기준 1단계 탈락 */

  --r-0:0; --r-1:6px; --r-2:10px; --r-3:16px; --r-full:999px;   /* 작은 컨트롤 6 · 띠·칩 10 · 창 16 · 가로 칩 full */
  --control-h:36px; --touch:44px;
  --icon-inline:17px; --icon-solo:20px;
  --bar-h:56px;
  --page-max:1080px;
  --pad-x:clamp(14px,3.2vw,32px);

  --motion-fast:140ms; --motion-ui:240ms;
  --ease-out:cubic-bezier(.2,0,0,1); --ease-in:cubic-bezier(.4,0,1,1);
}
:root[data-theme="light"]{
  color-scheme:light;
  --surface-0:#F5F7FA;  --surface-1:#FFFFFF;  --surface-2:#EAEEF3;
  --text-1:#111C2B;     --text-2:#45556A;     --text-3:#5F6F83;
  --line-1:#E1E6EC;     --line-2:#C7D0DB;     --rule:#111C2B;   --leader:#AEB9C6;
  --accent:#0F6FB8;     --accent-strong:#0A5794; --accent-weak:#E1EDF8;
  --accent-fill:#0F6FB8; --accent-fill-hover:#0A5794; --on-accent:#FFFFFF;
  --focus:#0F6FB8;
  --success:#1F8A5B;    --warning:#A86200;    --danger:#C23B36;
  --mark:#FFE58A;
  --scrim:rgba(17,28,43,.5);
  --shadow-float:0 18px 44px -16px rgba(17,28,43,.42),0 1px 2px rgba(17,28,43,.08);
  --brand-pink:#FFB7B2; --on-brand-pink:#3A1F1C;
  --yt:#E5002D;         --ig:#C92A75;
  --qr-dark:#000000;    --qr-light:#FFFFFF;
  /* 과학 영역 색 — 아이콘 선·목차 점·단원 번호에만 쓴다(글자 본문에는 쓰지 않는다). 타일 면은 이 색을 표면에 섞어 만든다 */
  --d-phy:#5856D6;  --d-chem:#0B8A7C;  --d-life:#3C8A2F;  --d-earth:#AE6A13;  --d-etc:#5F6F83;
  --tile-mix:13%;
  /* 채널 공식 아이콘 — 테마와 무관하게 같은 색 */
  --yt-red:#FF0000; --brand-on:#FFFFFF;
  --ig-1:#FEDA75;   --ig-2:#FA7E1E;   --ig-3:#D62976;   --ig-4:#962FBF;   --ig-5:#4F5BD5;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#0E141B;  --surface-1:#151D26;  --surface-2:#1D2732;
  --text-1:#E9EEF3;     --text-2:#AEBBC8;     --text-3:#8394A6;
  --line-1:#202B37;     --line-2:#324151;     --rule:#C9D4DF;   --leader:#3F4E60;
  --accent:#6AB2EE;     --accent-strong:#9ACBF4; --accent-weak:#15304A;
  --accent-fill:#6AB2EE; --accent-fill-hover:#8EC4F2; --on-accent:#0A1622;
  --focus:#7DBCF2;
  --success:#3BB27C;    --warning:#E0A240;    --danger:#F07470;
  --mark:#6B5410;
  --scrim:rgba(0,0,0,.62);
  --shadow-float:0 20px 48px -14px rgba(0,0,0,.75),0 1px 2px rgba(0,0,0,.45);
  --brand-pink:#FFB7B2; --on-brand-pink:#3A1F1C;
  --yt:#FF5470;         --ig:#F07DB2;
  --qr-dark:#000000;    --qr-light:#FFFFFF;
  --d-phy:#A5A4F5;  --d-chem:#4FCBBB;  --d-life:#85CF73;  --d-earth:#E6A95E;  --d-etc:#97A7B9;
  --tile-mix:20%;
  --yt-red:#FF0000; --brand-on:#FFFFFF;
  --ig-1:#FEDA75;   --ig-2:#FA7E1E;   --ig-3:#D62976;   --ig-4:#962FBF;   --ig-5:#4F5BD5;
}
/* 고대비 선호 — 경계선·보조 글자를 한 단계 진하게 (§12) */
@media (prefers-contrast:more){
  :root[data-theme="light"]{--line-1:#AEB9C6;--line-2:#7C8A9B;--leader:#6B7A8C;--text-2:#2E3B4C;--text-3:#3F4D5F}
  :root[data-theme="dark"] {--line-1:#3E4D5E;--line-2:#5A6B7D;--leader:#7A8A9C;--text-2:#D3DCE5;--text-3:#B4C1CE}
}

/* ══ 기본 마감 (§6.8-4·8) ══ */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scrollbar-gutter:stable;
  scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
html:has(dialog[open]){overflow:hidden}
body{
  margin:0;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--surface-0);color:var(--text-1);
  font-family:var(--font-ui);font-size:15px;line-height:1.65;letter-spacing:0;
  word-break:keep-all;overflow-wrap:break-word;
  transition:background-color var(--motion-ui) var(--ease-out),color var(--motion-ui) var(--ease-out);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:inherit}
ul,ol{margin:0;padding:0;list-style:none}
::selection{background:color-mix(in oklab,var(--accent) 26%,transparent)}
input{caret-color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-1)}
:focus:not(:focus-visible){outline:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--r-full);border:2px solid transparent;background-clip:content-box}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico--fill{fill:currentColor;stroke:none}
.n{font-variant-numeric:tabular-nums}
.skip{position:fixed;left:12px;top:-60px;z-index:90;padding:8px 14px;border-radius:var(--r-1);
  background:var(--surface-1);color:var(--text-1);font-size:13px;font-weight:600;text-decoration:none;
  box-shadow:var(--shadow-float);transition:top var(--motion-fast) var(--ease-out)}
.skip:focus{top:10px}

/* ══ 상단 바 — [칩][송쌤과학] │ [YouTube][Instagram] · · · 유틸리티 (§14·§14.1·§6.5-5) ══ */
.bar{position:sticky;top:0;z-index:30;background:var(--surface-0);border-bottom:1px solid transparent;
  transition:border-color var(--motion-ui) var(--ease-out),background-color var(--motion-ui) var(--ease-out)}
.bar.is-scrolled{border-bottom-color:var(--line-1)}
.bar__in{max-width:var(--page-max);margin-inline:auto;padding-inline:var(--pad-x);height:var(--bar-h);
  display:flex;align-items:center;gap:12px}
.brandset{display:flex;align-items:center;gap:10px;flex:none}
.brand{position:relative;display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text-1);
  font-size:13px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand::before{content:"";position:absolute;inset:-9px -6px}
.brand__chip{width:27px;height:27px;border-radius:var(--r-2);background:var(--brand-pink);color:var(--on-brand-pink);
  display:grid;place-items:center;flex:none}
.brand__chip .ico{font-size:16px;stroke-width:2.1}
.vr{width:1px;height:15px;background:var(--line-2);flex:none}
.channels{display:flex;align-items:center;gap:8px}
.ch,.iconbtn{position:relative;width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:var(--r-1);
  color:var(--text-2);text-decoration:none;
  transition:color var(--motion-fast) var(--ease-out),background-color var(--motion-fast) var(--ease-out)}
.ch::before,.iconbtn::before{content:"";position:absolute;inset:-4px}   /* 보이는 36px · 터치 44px — 간격 8px라 겹치지 않는다 */
/* 채널 아이콘은 공식 색 그대로 — 알아보는 것이 목적이므로 모양·색을 바꾸지 않는다 (§14.1) */
.brandico{display:block;flex:none}
.ch .brandico--yt{width:26px;height:19px}
.ch .brandico--ig{width:22px;height:22px}
.iconbtn .ico{font-size:var(--icon-solo)}
@media (hover:hover){.iconbtn:hover,.ch:hover{background:var(--surface-2);color:var(--text-1)}}
.iconbtn:active,.ch:active{transform:scale(.94)}
.bar__title{display:flex;align-items:center;gap:12px;min-width:0;font-size:13px;font-weight:600;color:var(--text-1);
  white-space:nowrap;opacity:0;transform:translateY(3px);pointer-events:none;
  transition:opacity var(--motion-ui) var(--ease-out),transform var(--motion-ui) var(--ease-out)}
.bar__title::before{content:"";width:1px;height:15px;background:var(--line-2);flex:none}
.bar__title span{overflow:hidden;text-overflow:ellipsis}
.bar.is-titled .bar__title{opacity:1;transform:none}
.utils{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}

@media (max-width:639px){
  :root{--bar-h:52px}
  .bar__title{display:none}
}

/* ══ 쪽 머리 — 제목은 길잡이. hero를 두지 않는다 (§6.2 크기표: hero는 랜딩형 전용) ══ */
.shell{container:shell/inline-size;flex:1;width:100%;max-width:var(--page-max);margin-inline:auto;padding:0 var(--pad-x) 48px}

.head{padding:26px 0 24px}
.head h1{font-family:var(--font-title);font-size:clamp(22px,1.1rem + 1.1vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.2}
.lead{margin-top:8px;max-width:34em;font-size:15px;color:var(--text-2)}
.stats{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;font-weight:500;color:var(--text-2)}
.stats b{margin-left:5px;font-weight:600;color:var(--text-1);font-variant-numeric:tabular-nums}

/* ══ 세그먼트 — 보기 전환 (단원별|최신순) ══ */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-2);background:var(--surface-2)}
.seg button{position:relative;height:30px;padding:0 12px;border-radius:var(--r-1);display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap;
  transition:background-color var(--motion-fast) var(--ease-out),color var(--motion-fast) var(--ease-out)}
.seg button::before{content:"";position:absolute;inset:-7px 0}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--text-1);font-weight:600;box-shadow:0 0 0 1px var(--line-2)}
@media (hover:hover){.seg button[aria-pressed="false"]:hover{color:var(--text-1)}}
.seg .n{font-size:12px;font-weight:500;color:var(--text-2)}

/* ══ 배치 — Index + list. 역할을 자리에 미리 묶지 않고 컨테이너 폭으로 재배치한다 (§4) ══ */
.layout{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"labs";align-items:start}
.toc{grid-area:toc;display:none}
.labs{grid-area:labs;min-width:0;container:labs/inline-size}

@container shell (min-width:760px){
  .layout{grid-template-columns:196px minmax(0,1fr);grid-template-areas:"toc labs";column-gap:clamp(28px,3.2vw,44px)}
  .toc{display:block;position:sticky;top:calc(var(--bar-h) + 18px);max-height:calc(100dvh - var(--bar-h) - 34px);
    overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px}
  .labs .chipbar{display:none}          /* 기본 .chipbar 규칙이 뒤에 오므로 선택자를 한 단계 올린다 */

}

.colhead{display:flex;align-items:baseline;gap:8px;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.4}
.colhead .n{font-size:12px;font-weight:500;color:var(--text-2);letter-spacing:0}

/* ══ 목차 레일 — 형태 문법 ③ 오른쪽 정렬 개수 ══ */
.toc__label{margin:5px 0 8px 10px;font-size:12px;font-weight:600;color:var(--text-2)}
.toc ul{display:flex;flex-direction:column;gap:1px}
.toc li.toc__g{margin-top:8px}
.toc a{position:relative;display:flex;align-items:baseline;gap:6px;min-height:34px;padding:7px 10px;border-radius:var(--r-1);
  text-decoration:none;font-size:13px;font-weight:500;line-height:1.45;color:var(--text-2);
  transition:background-color var(--motion-fast) var(--ease-out),color var(--motion-fast) var(--ease-out)}
.toc a .n{margin-left:auto;padding-left:8px;font-size:12px;font-weight:500;color:var(--text-2)}
.toc a.toc__grade,.toc a.toc__all{color:var(--text-1);font-weight:600}
.toc a.toc__unit{padding-left:12px;gap:7px}
.toc .no{width:1.1em;flex:none;font-size:12px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
.toc .nm{min-width:0}
@media (hover:hover){.toc a:hover{background:var(--surface-2);color:var(--text-1)}}
.toc a[aria-current="true"]{background:var(--accent-weak);color:var(--text-1);font-weight:600}
.toc a[aria-current="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:var(--r-full);background:var(--accent)}
@media (pointer:coarse){.toc a{min-height:44px;align-items:center}}

/* ══ 가상실험실 열 ══ */
.labs__h{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.band{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 10px 9px 12px;border-radius:var(--r-2);
  font-size:13px;font-weight:500;line-height:1.5;color:var(--text-1)}
.band > .ico{font-size:18px}
.band p{flex:1;min-width:0}
.band b{font-weight:600}
.band--warn{background:var(--surface-2)}
.band--warn > .ico{color:var(--warning)}

.band--sent{background:var(--accent-weak)}
.band--sent > .ico{color:var(--accent)}

.toolbar{display:flex;align-items:center;gap:10px}
.search{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.search > .ico{position:absolute;left:12px;font-size:17px;color:var(--text-2);pointer-events:none}
.search input{width:100%;height:40px;padding:0 12px 0 38px;border-radius:var(--r-1);border:1px solid var(--line-2);
  background:var(--surface-1);color:var(--text-1);font-size:16px;   /* 16px — iOS 포커스 확대 방지 (§6.8-8) */
  transition:border-color var(--motion-fast) var(--ease-out)}
.search input::placeholder{color:var(--text-2);opacity:1}
.search input::-webkit-search-cancel-button{display:none}
@media (hover:hover){.search input:hover{border-color:var(--text-3)}}
.search input:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
.search__kbd{position:absolute;right:10px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px;
  border:1px solid var(--line-2);border-radius:var(--r-1);font:600 12px/1 var(--font-ui);color:var(--text-2);pointer-events:none}
.search__clear{position:absolute;right:2px;width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-1);color:var(--text-2)}
.search__clear .ico{font-size:16px}
@media (hover:hover){.search__clear:hover{color:var(--text-1);background:var(--surface-2)}}
.search input:placeholder-shown ~ .search__clear,
.search input:not(:placeholder-shown) ~ .search__kbd,
.search input:focus ~ .search__kbd{display:none}
@media (hover:none){.search__kbd{display:none}}
/* 오른쪽 여백은 지우기 버튼·단축키 표시가 실제로 보일 때만 비운다 — 좁은 화면에서 안내 문구가 잘리지 않게 */
.search input:not(:placeholder-shown){padding-right:42px}
@media (hover:hover){.search input{padding-right:42px}}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--control-h);padding:0 14px;
  border-radius:var(--r-1);border:1px solid var(--line-2);background:transparent;color:var(--text-1);
  font-size:13px;font-weight:600;white-space:nowrap;text-decoration:none;flex:none;
  transition:background-color var(--motion-fast) var(--ease-out),border-color var(--motion-fast) var(--ease-out),color var(--motion-fast) var(--ease-out)}
.btn::before{content:"";position:absolute;inset:-4px 0}
.btn .ico{font-size:var(--icon-inline)}
@media (hover:hover){.btn:hover{background:var(--surface-2)}}
.btn:active{transform:scale(.98)}
.btn--field{height:40px}
.btn--field::before{inset:-2px 0}
.btn--primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
@media (hover:hover){.btn--primary:hover{background:var(--accent-fill-hover);border-color:var(--accent-fill-hover)}}

.chipbar{display:grid;gap:10px;margin-top:14px}
.chips{position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--pad-x) * -1);
  padding:1px var(--pad-x);scroll-padding-inline:var(--pad-x)}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;
  border:1px solid var(--line-2);border-radius:var(--r-full);text-decoration:none;white-space:nowrap;
  font-size:13px;font-weight:500;color:var(--text-2)}
.chip::before{content:"";position:absolute;inset:-5px 0}
.chip .n{font-size:12px;color:var(--text-2)}
.chip .no{font-weight:600;color:var(--text-2)}
.chip[aria-current="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--text-1);font-weight:600}

.listhead{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;margin-top:16px}
.count{min-width:0;font-size:13px;font-weight:500;color:var(--text-2)}
.count b{font-weight:600;color:var(--text-1)}

/* ══ 목록 — 영역 색 아이콘 타일 (L4: 목차 점 · 단원 번호 · 실험 타일이 같은 과학 영역 색으로 이어진다) ══ */
.list{padding-bottom:8px}
.grp{margin-top:34px}
.grp:first-child{margin-top:14px}
.grp__h{display:flex;align-items:baseline;gap:10px;padding-top:9px;border-top:2px solid var(--rule);
  font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.4}
.grp__h .n{margin-left:auto;font-size:12px;font-weight:500;color:var(--text-2);letter-spacing:0}
.grp__h + .items{margin-top:12px}
.unit{margin-top:22px}
.unit__head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.unit__h{display:flex;align-items:baseline;gap:10px;min-width:0;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.35}
.unit__no{font-weight:800;color:var(--dom);font-variant-numeric:tabular-nums}
.unit__no:empty{display:none}
.unit__n{margin-left:auto;flex:none;font-size:12px;font-weight:500;color:var(--text-2)}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,272px),1fr));gap:8px}
.item{position:relative;display:flex;align-items:center;gap:12px;min-height:66px;padding:10px;
  border:1px solid var(--line-1);border-radius:var(--r-2);background:var(--surface-1);
  transition:border-color var(--motion-fast) var(--ease-out)}
@media (hover:hover){.item:hover{border-color:color-mix(in oklab,var(--dom) 55%,var(--line-2))}}
.item__ic{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:var(--r-2);
  color:var(--dom);background:color-mix(in oklab,var(--dom) var(--tile-mix),var(--surface-1))}
.item__ic .ico{font-size:24px;stroke-width:1.6}
.item__body{flex:1;min-width:0}
.item__link{display:block;text-decoration:none;color:var(--text-1)}
.item__link::after{content:"";position:absolute;inset:0;border-radius:var(--r-2)}     /* 타일 전체가 링크 */
.item__t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:15px;font-weight:600;line-height:1.42;letter-spacing:-.01em}
@media (hover:hover){.item:hover .item__t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:var(--text-3)}}
.item__m{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin-top:3px;
  font-size:12px;font-weight:500;line-height:1.5;color:var(--text-2);font-variant-numeric:tabular-nums}
.item__m:empty{display:none}
.item__m .new{margin-left:0}
@supports selector(:has(*)){
  .item__link:focus-visible{outline:none}
  .item:has(.item__link:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
}
.new{display:inline-block;margin-left:7px;padding:0 5px;border-radius:var(--r-1);vertical-align:1px;
  font-size:12px;font-weight:600;line-height:1.55;letter-spacing:.02em;color:var(--accent-strong);background:var(--accent-weak)}
mark{background:var(--mark);color:inherit;font-weight:700;border-radius:0;padding:0 1px;margin:0 -1px}

.item__go{flex:none;font-size:16px;color:var(--text-2);transition:color var(--motion-fast) var(--ease-out)}
@media (hover:hover){.item:hover .item__go{color:var(--dom)}}

/* ══ 새로 올라온 실험 — 최근 한 달 ══ */
.shelf{margin:16px 0 4px;padding:14px;border-radius:var(--r-3);
  background:color-mix(in oklab,var(--accent) 6%,var(--surface-0));border:1px solid color-mix(in oklab,var(--accent) 20%,var(--line-1))}
.shelf__head{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:10px}
.shelf__head h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;letter-spacing:-.01em}
.shelf__head h3 .new{margin:0}
.shelf__sub{font-size:12px;font-weight:500;color:var(--text-2)}
.shelf__more{position:relative;margin-left:auto;padding:4px 2px;font-size:13px;font-weight:600;color:var(--accent-strong)}
.shelf__more::before{content:"";position:absolute;inset:-8px -4px}
@media (hover:hover){.shelf__more:hover{text-decoration:underline;text-underline-offset:3px}}

/* 영역 색 점 — 목차 · 칩 · 범례 */
.dot{width:8px;height:8px;flex:none;align-self:center;border-radius:var(--r-full);background:var(--dom)}
.chip .dot{width:7px;height:7px}
.fresh{display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:var(--r-full);background:var(--accent);vertical-align:2px}
.legend{margin:18px 10px 4px;padding-top:12px;border-top:1px solid var(--line-1)}
.legend p{margin-bottom:6px;font-size:12px;font-weight:600;color:var(--text-2)}
.legend ul{display:flex;flex-wrap:wrap;gap:4px 12px}
.legend li{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-2)}

/* ══ 상태 ══ */
.sk{height:13px;margin:15px 0;border-radius:var(--r-1);background:var(--surface-2);animation:skp 1.2s ease-in-out infinite alternate}
.sk--h{height:18px;width:38%;margin-top:26px}
@keyframes skp{from{opacity:.55}to{opacity:1}}
.empty{padding:30px 0 12px}
.empty h3{font-size:18px;font-weight:600;letter-spacing:-.02em}
.empty p{margin-top:6px;max-width:30em;font-size:15px;color:var(--text-2)}
.empty__btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* ══ 바닥글 — 브랜드 문구 + 전환 링크 (§14.1 ②) ══ */
.foot{border-top:1px solid var(--line-1)}
.foot__in{max-width:var(--page-max);margin-inline:auto;padding:10px var(--pad-x) 22px;display:flex;flex-wrap:wrap;align-items:center;
  gap:4px 24px;font-size:12px;font-weight:500;color:var(--text-2)}
.foot__brand b{font-weight:600;color:var(--text-1)}
.foot__links{display:flex;flex-wrap:wrap;gap:0 18px;margin-left:auto}
.foot__links a{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;color:var(--text-2)}
.foot__links a .ico{font-size:15px}
.foot__links .brandico--yt{width:18px;height:13px}
.foot__links .brandico--ig{width:15px;height:15px}
@media (hover:hover){.foot__links a:hover{color:var(--text-1);text-decoration:underline;text-underline-offset:3px}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:1ms!important}
  .iconbtn:active,.ch:active,.btn:active,.tbtn:active{transform:none}
  .iconbtn.is-busy .ico,.sk{animation:none}
  .bar__title{transform:none}
  @keyframes dlgIn{from{opacity:0}}
}

/* ══ 인쇄 — 테마와 무관하게 흰 종이·검은 글자, 링크는 주소를 함께 (§13.5.1 ①) ══ */
@media print{
  :root[data-theme]{--surface-0:#fff;--surface-1:#fff;--surface-2:#fff;--text-1:#000;--text-2:#333;--text-3:#444;
    --line-1:#bbb;--line-2:#999;--rule:#000;--leader:#999;--accent:#000;--accent-strong:#000;--accent-weak:#fff;--mark:#fff}
  html{scrollbar-gutter:auto}
  body{font-size:10.5pt;background:var(--surface-0)}
  .bar,.skip,.switch,.toc,.chipbar,.toolbar,.listhead .seg,.item__act,.item__go,.unit__send,.shelf,.band,.dlg,.foot__links,.tools__note,.search__kbd{display:none!important}
  .shell{max-width:none;padding:0}
  .head{padding:0 0 8pt}
  .layout,.layout[data-pane]{display:block!important}
  .labs,.tools{display:block!important;position:static!important;max-height:none!important;overflow:visible!important;border:0!important;padding:0!important}
  .labs__h{position:static;width:auto;height:auto;margin:10pt 0 4pt;overflow:visible;clip:auto;white-space:normal}
  .tools{margin-top:18pt}
  .items,.toollist{display:block}
  .item,.tool{display:block;min-height:0;margin:0;padding:3pt 0;border:0;background:none;break-inside:avoid}
  .item__ic,.tool__ic,.tool__ext{display:none}
  .item__t{display:inline;-webkit-line-clamp:unset}
  .item__m{display:inline-flex;margin:0 0 0 8pt}
  .item__link::after,.tool::after{content:attr(href);position:static;display:block;font-size:8.5pt;color:var(--text-2);word-break:break-all}
  .grp__h,.unit__head{break-after:avoid}
  mark{background:none;font-weight:inherit}
  a{text-decoration:none}
}

</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>

    <path style="fill:var(--brand-on)" d="M11.2 14.3 18.4 10l-7.2-4.3z"/>
  </symbol>
  <symbol id="b-instagram" viewBox="0 0 24 24">
    <rect width="24" height="24" rx="6.5" style="fill:url(#g-ig)"/>
    <rect x="5" y="5" width="14" height="14" rx="4.2" style="fill:none;stroke:var(--brand-on);stroke-width:1.9"/>
    <circle cx="12" cy="12" r="3.4" style="fill:none;stroke:var(--brand-on);stroke-width:1.9"/>

function endpoints(section){

/* 8초 안에 응답이 없으면 끊는다 — 느린 회선에서 로딩이 멈춰 있지 않게 */
function fetchTimeout(url, ms = 8000){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { cache:'no-store', signal:ctrl.signal }).finally(() => clearTimeout(timer));
}
async function loadSection(section){
  let fetched = false, lastErr = null;
  for (const url of endpoints(section)){
    try {
      const res = await fetchTimeout(url);
      if (!res.ok){ lastErr = new Error('HTTP ' + res.status); continue; }
      const text = await res.text();
      if (!text || /^\s*</.test(text)){ lastErr = new Error('CSV가 아님'); continue; }
      const table = parseCSV(text);
      const head = (table[0] || []).join(' ');
      if (section.expectHead && !section.expectHead.test(head)){ lastErr = new Error('다른 탭의 표: ' + head.slice(0, 40)); continue; }
      fetched = true;
      const items = toItems(table);
      if (items.length) return items;
    } catch (e){ lastErr = e; }
  }
  if (fetched) return [];
  throw lastErr || new Error('시트를 읽지 못했습니다');
}
/* CSV 파서 (따옴표·줄바꿈 포함 셀 지원) */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  const s = text.replace(/\r\n?/g, '\n');
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){
      if (c === '"'){ if (s[i + 1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}
/* 표 → 항목 (머리글 이름이 달라도 알아본다). 시트의 행 순서를 order로 보존한다 */
function toItems(table){
  if (!table.length) return [];
  const isUrl = v => /^https?:\/\//i.test(String(v).trim());
  const head = table[0].map(v => String(v).trim());
  const headerless = head.some(isUrl);
  const body = headerless ? table : table.slice(1);
  const map = headerless ? guessColumns(body) : mapColumns(head, body);
  if (map.url < 0) return [];
  const out = [];
  body.forEach((r, order) => {
    const get = k => (map[k] >= 0 && r[map[k]] != null) ? String(r[map[k]]).trim() : '';
    const url = get('url');
    if (!isUrl(url) || CONFIG.HIDE_URL.test(url)) return;
    const dateRaw = get('date');
    out.push(decorate({
      grade: get('grade'), unit: get('group'),
      title: get('title') || url.replace(/^https?:\/\//, '').replace(/\/$/, ''),
      url, dateRaw, date: parseDate(dateRaw), order, icon: get('icon')
    }));
  });
  return out;
}
function mapColumns(head, body){
  const n = h => h.replace(/\s/g, '').toLowerCase();
  const find = keys => head.findIndex(h => keys.some(k => n(h).includes(k)));
  const map = {
    grade: find(['학년','대상']),
    group: find(['단원','분류','카테고리','영역','구분','종류']),
    title: find(['실험명','도구','제목','이름','명칭','프로그램','자료','사이트','앱']),
    url:   find(['주소','링크','url','link']),
    date:  find(['편집일','날짜','수정','등록','업데이트','작성']),
    icon:  find(['아이콘','icon'])                 // 선택 열 — 없으면 실험명으로 자동
  };
  if (map.url < 0){
    const g = guessColumns(body);
    for (const k of Object.keys(map)) if (map[k] < 0) map[k] = g[k];
  }
  if (map.title < 0){
    for (let i = 0; i < head.length; i++){
      if ([map.url, map.date, map.grade, map.group].includes(i)) continue;
      map.title = i; break;
    }
  }
  return map;
}
function guessColumns(body){
  const cols = Math.max(0, ...body.map(r => r.length));
  const col = i => body.map(r => String(r[i] ?? '').trim());
  const ratio = (i, re) => { const v = col(i).filter(Boolean); return v.length ? v.filter(x => re.test(x)).length / v.length : 0; };
  const map = { grade:-1, group:-1, title:-1, url:-1, date:-1, icon:-1 };
  for (let i = 0; i < cols; i++){
    if (map.url   < 0 && ratio(i, /^https?:\/\//i) > .6){ map.url = i; continue; }
    if (map.date  < 0 && ratio(i, /\d{4}\D+\d{1,2}\D+\d{1,2}/) > .6){ map.date = i; continue; }
    if (map.grade < 0 && ratio(i, /^(중|고|초)\s?\d/) > .6){ map.grade = i; continue; }
  }
  const rest = [];
  for (let i = 0; i < cols; i++){
    if ([map.url, map.date, map.grade].includes(i)) continue;
    const v = col(i).filter(Boolean);
    if (v.length) rest.push({ i, uniq:new Set(v).size });
  }
  rest.sort((a, b) => a.uniq - b.uniq);
  if (rest.length === 1) map.title = rest[0].i;
  else if (rest.length >= 2){ map.group = rest[0].i; map.title = rest[rest.length - 1].i; }
  return map;
}

  ['continent', /대륙|판\s*구조|지진|화산/], ['earth', /지구/],               ['cloud', /날씨|기압|구름|대기|기상|바람/],
  ['planet', /태양계|행성|천체|별|우주|은하|달의|위성/], ['cell', /세포/],     ['leaf', /광합성|식물|잎/],
  ['dna', /유전|염색체|dna/i],               ['heart', /소화|순환|호흡|배설|심장|혈액/], ['testtube', /산\s*염기|중화|지시약|ph/i],
  ['reaction', /반응/],                      ['spark', /오로라|프롬프트|생성기/], ['quiz', /퀴즈|문제/],
  ['game', /게임|놀이/]
];
const ICON_IDS = new Set([...LAB_ICONS.map(([id]) => id), 'beaker', 'flask', 'testtube']);
const DOMAIN_ICON = { phy:'energy', chem:'beaker', life:'leaf', earth:'earth', etc:'flask' };
function iconOf(it){
  const own = String(it.icon || '').trim().toLowerCase().replace(/^i-/, '');
  if (ICON_IDS.has(own)) return 'i-' + own;
  for (const src of [it.title, it.unit]) for (const [id, re] of LAB_ICONS) if (re.test(src || '')) return 'i-' + id;
  return 'i-' + DOMAIN_ICON[it.dom || domainOf(it)];
}
function decorate(it){ it.dom = domainOf(it); it.ic = iconOf(it); return it; }

/* 학년 → 단원 목차 만들기 (학년은 초·중·고 순, 단원은 번호 순, 같으면 시트에 처음 나온 순) */
function buildIndex(items){
  const grades = new Map();
  items.forEach(it => {
    if (!grades.has(it.grade)) grades.set(it.grade, { grade:it.grade, rank:gradeRank(it.grade), count:0, first:it.order, units:new Map() });
    const g = grades.get(it.grade); g.count++;
    if (!g.units.has(it.unit)){ const s = splitUnit(it.unit); g.units.set(it.unit, { unit:it.unit, no:s.no, name:s.name, count:0, fresh:0, first:it.order, dom:it.dom }); }
    const u = g.units.get(it.unit);
    u.count++;
    if (isNew(it.date)) u.fresh++;
  });
  const byNo = s => s === '' ? 999 : Number(s);
  return [...grades.values()]
    .sort((a, b) => a.rank - b.rank || a.first - b.first)
    .map(g => ({ ...g, unitList:[...g.units.values()].sort((a, b) => byNo(a.no) - byNo(b.no) || a.first - b.first) }));
}

/* ============================================================
   테마 (세 페이지 공통) — 스위치는 <html data-theme> 하나, 저장 키는 시리즈 공통 (§6.5-5)
      첫 로드에서는 저장하지 않는다: 누른 적이 없으면 라이트 기본값이 유지된다
   ============================================================ */
const btnTheme = $('#btn-theme');
function applyTheme(t, save = true){
  const root = document.documentElement;
  root.dataset.theme = t;
  if (save){ try { localStorage.setItem(CONFIG.THEME_KEY, t); } catch (e){} }
  const next = t === 'dark' ? '라이트' : '다크';
  btnTheme.setAttribute('aria-label', `${next} 모드로 전환`);
  btnTheme.title = `${next} 모드로 전환 (D)`;
  btnTheme.querySelector('use').setAttribute('href', t === 'dark' ? '#i-moon' : '#i-sun');
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--surface-0').trim());
}
function toggleTheme(){ applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); }
/* 다른 탭(교사용↔학생용·실험실)에서 바꾸면 여기도 따라간다 */
addEventListener('storage', e => {
  if (e.key === CONFIG.THEME_KEY && (e.newValue === 'dark' || e.newValue === 'light')) applyTheme(e.newValue, false);
});

applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light', false);   // 첫 로드: 아이콘·이름만 맞추고 저장하지 않는다

/* ============================================================
   6) 그리기
   ============================================================ */
const icon = (id, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#${id}"></use></svg>`;
const NEW_TAG = '<span class="sr"> </span><span class="new">NEW</span>';   // 읽을 때 앞말과 붙지 않게 띄어 준다
const domStyle = d => `style="--dom:var(--d-${d || 'etc'})"`;
const DOMAIN_ORDER = ['phy', 'chem', 'life', 'earth', 'etc'];

/* 검색어 강조 — 띄어쓰기를 무시하고 찾은 범위를 원문 위치로 되돌려 <mark>로 감싼다 */
function hl(text, q){
  const nq = norm(q);
  if (!nq) return esc(text);
  const map = []; let flat = '';
  for (let i = 0; i < text.length; i++){ if (/\s/.test(text[i])) continue; map.push(i); flat += text[i].toLowerCase(); }
  let out = '', last = 0, from = 0, at;
  while ((at = flat.indexOf(nq, from)) !== -1){
    const s = map[at], e = map[at + nq.length - 1] + 1;
    out += esc(text.slice(last, s)) + '<mark>' + esc(text.slice(s, e)) + '</mark>';
    last = e; from = at + nq.length;
  }
  return out + esc(text.slice(last));
}
const matches = (it, nq) => !nq || norm(`${it.title}${it.unit}${it.grade}`).includes(nq);
function visibleItems(f = state.f){
  const { grade, unit } = f, nq = norm(f.q);
  return state.data.lab.filter(it => (!grade || it.grade === grade) && (!unit || it.unit === unit) && matches(it, nq));
}
function hrefFor(patch){
  const s = paramsFor({ ...state.f, ...patch }).toString();
  return esc(location.pathname + (s ? '?' + s : ''));
}

function renderStats(){
  const lab = state.data.lab.length;
  $('#st-lab').textContent = lab || '–';
  $('#labs-n').textContent = lab || '';

  const dates = [...state.data.lab].map(i => i.date).filter(Boolean);
  $('#st-last').textContent = dates.length ? fmt(new Date(Math.max(...dates))) : '–';
  const fresh = state.data.lab.filter(i => isNew(i.date)).length;
  $('#st-new').textContent = fresh ? `${fresh}` : '0';
}

/* 목차 레일 (넓은 화면) — 단원마다 영역 색 점, 새 실험이 있으면 작은 표시 */
function renderTOC(){
  const toc = $('#toc');
  if (!state.index.length){
    toc.innerHTML = `<p class="toc__label">목차</p>` + (state.status.lab === 'loading' ? '<div class="sk"></div>'.repeat(7) : '');
    return;
  }
  const link = (cls, g, u, label, n) =>
    `<a class="${cls}" href="${hrefFor({ grade:g, unit:u })}" data-grade="${esc(g)}" data-unit="${esc(u)}">${label}<span class="n">${n}<span class="sr">개</span></span></a>`;
  let h = `<p class="toc__label" aria-hidden="true">목차</p><ul role="list">`;
  h += `<li>${link('toc__all', '', '', '<span>전체</span>', state.data.lab.length)}</li>`;
  state.index.forEach(g => {
    h += `<li class="toc__g">${link('toc__grade', g.grade, '', `<span>${esc(g.grade || '기타')}</span>`, g.count)}<ul role="list">`;
    g.unitList.forEach(u => {
      const label = `<span class="dot" ${domStyle(u.dom)} aria-hidden="true"></span><span class="no" aria-hidden="true">${esc(u.no)}</span>` +
        `<span class="nm">${esc(u.name)}${u.fresh ? `<span class="fresh" title="최근 한 달 새 실험 ${u.fresh}개"><span class="sr"> 새 실험 ${u.fresh}개</span></span>` : ''}</span>`;
      h += `<li>${link('toc__unit', g.grade, u.unit, label, u.count)}</li>`;
    });
    h += `</ul></li>`;
  });
  h += `</ul>`;
  const doms = DOMAIN_ORDER.filter(d => state.data.lab.some(i => i.dom === d));
  h += `<div class="legend"><p>아이콘 색은 과학 영역</p><ul role="list">${
    doms.map(d => `<li ${domStyle(d)}><span class="dot" aria-hidden="true"></span>${DOMAIN_LABEL[d]}</li>`).join('')}</ul></div>`;
  toc.innerHTML = h;
  markCurrent();
}
/* 가로 칩 (좁은 화면) — 학년 줄 + 고른 학년의 단원 줄 */
function renderChips(){
  const bar = $('#chipbar');
  if (!state.index.length){ bar.innerHTML = ''; return; }
  const { grade, unit } = state.f;
  const chip = (g, u, label, n, on) =>
    `<a class="chip" href="${hrefFor({ grade:g, unit:u })}" data-grade="${esc(g)}" data-unit="${esc(u)}"${on ? ' aria-current="true"' : ''}>${label}<span class="n">${n}</span></a>`;
  let h = `<div class="chips" role="group" aria-label="학년">` +
    chip('', '', '전체', state.data.lab.length, !grade && !unit) +
    state.index.map(g => chip(g.grade, '', esc(g.grade || '기타'), g.count, grade === g.grade && !!grade)).join('') + `</div>`;
  const g = state.index.find(x => x.grade === grade && grade);
  if (g && g.unitList.length > 1){
    h += `<div class="chips" role="group" aria-label="${esc(g.grade)} 단원">` +
      chip(g.grade, '', `${esc(g.grade)} 전체`, g.count, !unit) +
      g.unitList.map(u => chip(g.grade, u.unit,
        `<span class="dot" ${domStyle(u.dom)} aria-hidden="true"></span>` + (u.no ? `<span class="no">${esc(u.no)}</span>` : '') + esc(u.name),
        u.count, unit === u.unit)).join('') + `</div>`;
  }
  bar.innerHTML = h;
  /* 고른 칩을 줄 가운데로 — 칩 줄만 가로로 옮긴다(scrollIntoView는 페이지까지 끌어올린다) */
  $$('.chips', bar).forEach(row => {
    const on = $('.chip[aria-current="true"]', row);
    if (on) row.scrollLeft = Math.max(0, on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2);
  });
}
/* 목차의 현재 위치만 바꾼다 — DOM을 새로 만들지 않아 포커스가 그 자리에 남는다 */
function markCurrent(){
  const { grade, unit } = state.f;
  $$('#toc a[data-grade]').forEach(a => {
    const on = a.dataset.grade === grade && a.dataset.unit === unit;
    if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
    a.setAttribute('href', hrefFor({ grade:a.dataset.grade, unit:a.dataset.unit }).replace(/&amp;/g, '&'));
  });
}
function renderNav(full){
  if (full) renderTOC(); else markCurrent();
  renderChips();
  $$('.seg [data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.f.view)));
}

function renderCount(n){
  const { grade, unit } = state.f, q = state.f.q.trim();
  const scope = unit ? [grade, unitLabel(unit)].filter(Boolean).join(' › ') : (grade || '전체');
  $('#count').innerHTML = q
    ? `<b>‘${esc(q)}’</b> ${n}개${grade || unit ? ` · ${esc(scope)}에서` : ''}`
    : `<b>${esc(scope)}</b> · ${n}개`;
}
/* 실험 타일 — [영역 색 아이콘] 실험명 / 날짜·NEW (최신순·새 실험 선반에서는 학년·단원도) */
function tile(it, { meta = false, newTag = true } = {}){
  const where = meta ? [it.grade, unitLabel(it.unit)].filter(Boolean).join(' · ') : '';
  return `<li class="item" ${domStyle(it.dom)}>
    <span class="item__ic" title="${DOMAIN_LABEL[it.dom]}">${icon(it.ic)}</span>
    <div class="item__body">
      <a class="item__link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer"><span class="item__t">${hl(it.title, state.f.q)}</span><span class="sr"> (새 창)</span></a>
      <p class="item__m">${where ? `<span class="item__where">${esc(where)}</span>` : ''}${it.date ? `<time datetime="${iso(it.date)}">${meta ? fmtMD(it.date) : fmt(it.date)}</time>` : ''}${newTag && isNew(it.date) ? NEW_TAG : ''}</p>
    </div>
    ${icon('i-ext', 'item__go')}
  </li>`;
}

/* 단원별 — 학년 굵은 선 › 단원 머리(영역 색 번호) › 실험 타일 */
function unitHTML(items){
  const byG = new Map();
  items.forEach(it => {
    if (!byG.has(it.grade)) byG.set(it.grade, new Map());
    const m = byG.get(it.grade);
    if (!m.has(it.unit)) m.set(it.unit, []);
    m.get(it.unit).push(it);
  });
  const showGrade = !state.f.grade, uh = showGrade ? 'h4' : 'h3';
  let h = '';
  state.index.forEach(g => {
    const um = byG.get(g.grade);
    if (!um) return;
    const n = [...um.values()].reduce((s, a) => s + a.length, 0);
    h += `<section class="grp" aria-label="${esc(g.grade || '기타')} ${n}개">`;
    if (showGrade) h += `<h3 class="grp__h"><span>${esc(g.grade || '기타')}</span><span class="n">${n}개</span></h3>`;
    g.unitList.forEach(u => {
      const rows = um.get(u.unit);
      if (!rows) return;
      h += `<div class="unit" ${domStyle(u.dom)}>
        <div class="unit__head">
          <${uh} class="unit__h"><span class="unit__no">${esc(u.no)}</span><span class="unit__nm">${hl(u.name, state.f.q)}</span></${uh}>
          <span class="unit__n">${DOMAIN_LABEL[u.dom]} · ${rows.length}개</span>
        </div>
        <ul class="items" role="list">${rows.map(it => tile(it)).join('')}</ul></div>`;
    });
    h += `</section>`;
  });
  return h;
}
/* 최신순 — 편집한 달로 묶는다 */
function recentHTML(items){
  const t = it => it.date ? it.date.getTime() : -1;
  const sorted = [...items].sort((a, b) => t(b) - t(a) || a.order - b.order);
  const groups = new Map();
  sorted.forEach(it => {
    const k = it.date ? `${it.date.getFullYear()}년 ${it.date.getMonth() + 1}월` : '날짜 없음';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  });
  let h = '';
  groups.forEach((arr, k) => {
    h += `<section class="grp" aria-label="${k} ${arr.length}개"><h3 class="grp__h"><span>${k}</span><span class="n">${arr.length}개</span></h3>
      <ul class="items items--flat" role="list">${arr.map(it => tile(it, { meta:true })).join('')}</ul></section>`;
  });
  return h;
}
/* 새로 올라온 실험 — 필터·검색이 없는 단원별 첫 화면에만, 최근 한 달 편집분 4개까지(나머지는 '모두 보기' → 최신순) */
function shelfHTML(){
  if (state.f.grade || state.f.unit || state.f.q.trim() || state.f.view !== 'unit') return '';
  const t = it => it.date ? it.date.getTime() : 0;
  const fresh = state.data.lab.filter(it => isNew(it.date)).sort((a, b) => t(b) - t(a) || a.order - b.order);
  if (!fresh.length) return '';
  const show = fresh.slice(0, 4);
  return `<section class="shelf" aria-labelledby="shelf-h">
    <div class="shelf__head">
      <h3 id="shelf-h"><span class="new">NEW</span> 새로 올라온 실험</h3>
      <span class="shelf__sub">최근 한 달 · ${fresh.length}개</span>
      ${fresh.length > show.length ? `<button type="button" class="shelf__more" data-view="recent">${fresh.length}개 모두 보기</button>` : ''}
    </div>
    <ul class="items items--flat" role="list">${show.map(it => tile(it, { meta:true, newTag:false })).join('')}</ul>
  </section>`;
}
function noResultsHTML(){
  const { grade, unit } = state.f, q = state.f.q.trim(), nq = norm(q);
  const inAll = nq ? state.data.lab.filter(it => matches(it, nq)).length : 0;
  let btns = '';
  if ((grade || unit) && inAll) btns += `<button type="button" class="btn btn--primary" data-act="search-all">전체에서 ‘${esc(q)}’ 찾기 · ${inAll}개</button>`;
  if (q) btns += `<button type="button" class="btn" data-act="clear-q">검색어 지우기</button>`;
  if (grade || unit) btns += `<button type="button" class="btn" data-act="reset">전체 목록 보기</button>`;
  return `<div class="empty">
    <h3>${q ? `‘${esc(q)}’에 맞는 실험이 없어요` : '이 목록을 찾지 못했어요'}</h3>
    <p>${q ? '낱말을 짧게 줄이거나 단원 이름으로 찾아보세요. 띄어쓰기는 상관없어요.' : '단원 이름이 바뀌었을 수 있어요. 전체 목록에서 찾아보세요.'}</p>
    <div class="empty__btns">${btns}</div></div>`;
}
function renderList(){
  const list = $('#list'), items = state.data.lab;
  if (!items.length){
    if (state.status.lab === 'loading'){
      $('#count').textContent = '목록을 불러오는 중…';
      list.innerHTML = '<div class="sk sk--h"></div>' + [62, 48, 70, 55, 66, 44].map(w => `<div class="sk" style="width:${w}%"></div>`).join('');
    } else {
      $('#count').textContent = '';
      list.innerHTML = `<div class="empty"><h3>아직 올라온 실험이 없어요</h3><p>${
        VARIANT === 'teacher' ? '시트 ‘과학’ 탭 첫 줄에 머리글을 두고 그 아래에 실험 링크를 적으면 여기에 바로 올라와요.' : '조금 뒤에 다시 들어와 주세요.'}</p>
        <div class="empty__btns"><button type="button" class="btn" data-act="retry">다시 불러오기</button></div></div>`;
    }
    return;
  }
  const vis = visibleItems();
  renderCount(vis.length);
  list.innerHTML = !vis.length ? noResultsHTML() : shelfHTML() + (state.f.view === 'recent' ? recentHTML(vis) : unitHTML(vis));
}

function renderSent(){
  const el = $('#sent');
  if (!state.sent){ el.hidden = true; return; }
  const { grade, unit } = state.f, q = state.f.q.trim();
  const what = [grade, unit && unitLabel(unit), q && `‘${q}’`].filter(Boolean).join(' › ') || '전체';
  $('#sent-txt').innerHTML = `<b>선생님이 보낸 목록</b> · ${esc(what)} · ${visibleItems().length}개`;
  el.hidden = false;
}

function renderNotice(){
  const el = $('#notice');
  const stale = KEYS.filter(k => state.status[k] === 'stale');
  if (!stale.length){ el.hidden = true; el.innerHTML = ''; return; }
  const at = stale.map(k => state.staleAt[k]).find(Boolean);
  const basis = at ? `${fmt(at)} ${hhmm(at)}에 저장해 둔 목록` : `${SNAPSHOT_DATE} 기준 목록`;
  el.innerHTML = `${icon('i-alert')}<p>${VARIANT === 'teacher'
      ? `<b>시트에 연결하지 못해</b> ${basis}을 보여 주고 있어요. 방금 추가한 행은 아직 안 보일 수 있어요.`
      : `<b>인터넷 연결이 불안정해</b> ${basis}을 보여 주고 있어요.`}</p>
    <button type="button" class="btn" data-act="retry">다시 불러오기</button>`;
  el.hidden = false;
}

function renderAll(){
  state.index = buildIndex(state.data.lab);
  renderStats();
  renderNav(true);
  renderList();
  renderNotice();

  renderSent();
}

/* ============================================================
   7) 주소 상태 — 학년·단원·검색어·보기를 주소에 담는다 (§13.5 ④)
      목차·칩·보기 전환은 기록을 남겨 뒤로 가기 = 필터 되돌리기, 타이핑은 기록을 덮어쓴다
   ============================================================ */
function paramsFor(f, extra = {}){
  const p = new URLSearchParams();
  if (f.grade) p.set('grade', f.grade);
  if (f.unit)  p.set('unit', f.unit);
  const q = String(f.q || '').trim();
  if (q) p.set('q', q);
  if (f.view === 'recent') p.set('view', 'recent');
  for (const [k, v] of Object.entries(extra)) if (v) p.set(k, v);
  return p;
}
function readURL(){
  const p = new URLSearchParams(location.search);
  state.f = { grade:p.get('grade') || '', unit:p.get('unit') || '', q:p.get('q') || '', view:p.get('view') === 'recent' ? 'recent' : 'unit' };

  state.sent = p.get('from') === 't';
  $('#q').value = state.f.q;
}
function syncURL(push){
  const s = paramsFor(state.f, { from: state.sent ? 't' : '' }).toString();
  if (s === new URLSearchParams(location.search).toString()) return;      // 같은 상태면 기록을 쌓지 않는다
  try { history[push ? 'pushState' : 'replaceState'](null, '', location.pathname + (s ? '?' + s : '') + location.hash); } catch (e){}
}
const filterKey = () => [state.f.grade, state.f.unit, state.f.q.trim()].join('');
function setFilter(patch, { push = true, scroll = true } = {}){
  const before = filterKey();
  Object.assign(state.f, patch);
  if (filterKey() !== before) state.sent = false;      // 학생이 목록을 바꾸면 더 이상 '선생님이 보낸 목록'이 아니다
  syncURL(push);
  renderNav(false);
  renderList();

  renderSent();
  if (scroll) keepListInView();
}
function clearQuery(){
  const q = $('#q');
  if (q.value || state.f.q){ q.value = ''; setFilter({ q:'' }, { push:false, scroll:false }); }
  q.focus();
}
/* 목록 머리가 상단 바 뒤로 올라가 있으면 목록 처음이 보이게 내린다 */
function keepListInView(){
  const head = $('.listhead');
  if (!head || !head.offsetParent) return;
  const barH = $('#bar').offsetHeight, top = head.getBoundingClientRect().top;
  if (top < barH) window.scrollBy({ top:top - barH - 12, behavior:reduceMotion() ? 'auto' : 'smooth' });
}
function focusSearch(){

  const q = $('#q'), r = q.getBoundingClientRect(), barH = $('#bar').offsetHeight;
  if (r.top < barH || r.bottom > innerHeight) window.scrollBy({ top:r.top - barH - 16, behavior:reduceMotion() ? 'auto' : 'smooth' });
  q.focus({ preventScroll:true });
  q.select();
}

let announceT;
function announce(msg){
  const el = $('#live');
  el.textContent = '';
  clearTimeout(announceT);
  announceT = setTimeout(() => { el.textContent = msg; }, 60);
}

/* ============================================================
   10) 이벤트
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target instanceof Element ? e.target : null;
  if (!t) return;

  const nav = t.closest('a[data-grade]');                    // 목차 레일 · 가로 칩
  if (nav){
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // 새 탭으로 열기는 그대로 둔다
    e.preventDefault();
    const g = nav.dataset.grade, u = nav.dataset.unit;
    setFilter({ grade:g, unit:u });
    if (!nav.isConnected){                                   // 칩은 새로 그려진다 — 같은 칩으로 포커스를 되돌린다
      const again = $(`#chipbar a[data-grade="${CSS.escape(g)}"][data-unit="${CSS.escape(u)}"]`);
      if (again) again.focus({ preventScroll:true });
    }
    return;
  }
  const view = t.closest('[data-view]');
  if (view) return setFilter({ view:view.dataset.view }, { scroll:false });

  const act = t.closest('[data-act]');
  if (act){
    switch (act.dataset.act){
      case 'retry':      return loadAll();
      case 'search-all': return setFilter({ grade:'', unit:'' });
      case 'clear-q':    return clearQuery();
      case 'reset':      $('#q').value = ''; return setFilter({ grade:'', unit:'', q:'' });
    }
    return;
  }
  if (t.closest('#q-clear')) return clearQuery();
  if (t.closest('#btn-theme')) return toggleTheme();

  if (t.closest('#sent-clear')){ $('#q').value = ''; setFilter({ grade:'', unit:'', q:'' }); return $('#q').focus({ preventScroll:true }); }

});

let qTimer, liveTimer;
$('#q').addEventListener('input', e => {
  const before = state.f.q.trim();
  state.f.q = e.target.value;
  if (state.f.q.trim() !== before) state.sent = false;
  renderNav(false);                                          // 목차 링크 주소에도 검색어를 싣는다
  renderList();

  renderSent();
  clearTimeout(qTimer);
  qTimer = setTimeout(() => syncURL(false), 300);
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => announce(`${visibleItems().length}개 실험`), 700);
});

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  const el = e.target instanceof Element ? e.target : null;
  if (el && el.closest('input, textarea, select, [contenteditable="true"]')){
    if (e.key === 'Escape' && el.id === 'q' && el.value){ e.preventDefault(); clearQuery(); }
    return;
  }
  if (document.querySelector('dialog[open]')){

    return;
  }
  /* 자판 위치(code)와 글자(key)를 둘 다 본다 — 한글 자판에서는 D 자리가 'ㅇ'이다 */
  if (e.code === 'KeyD' || e.key === 'd' || e.key === 'D' || e.key === 'ㅇ'){ e.preventDefault(); toggleTheme(); }
  else if (e.code === 'Slash' || e.key === '/'){ e.preventDefault(); focusSearch(); }
});

addEventListener('popstate', () => {
  readURL();

  renderNav(false);
  renderList();

  renderSent();
});

/* 상단 바 — 내리면 경계선, 제목이 가려지면 바에 작은 제목 */
const bar = $('#bar');
const onScroll = () => bar.classList.toggle('is-scrolled', scrollY > 4);
addEventListener('scroll', onScroll, { passive:true });
onScroll();
if ('IntersectionObserver' in window){
  new IntersectionObserver(([en]) => bar.classList.toggle('is-titled', !en.isIntersecting),
    { rootMargin:`-${bar.offsetHeight}px 0px 0px 0px` }).observe($('#h1'));
}

/* ============================================================
   11) 불러오기 — 캐시로 먼저 그리고, 시트를 새로 읽어 바뀐 것만 다시 그린다
   ============================================================ */
let loading = false;
const sig = () => JSON.stringify(KEYS.map(k => [state.status[k], state.data[k].map(i => [i.grade, i.unit, i.title, i.url, i.dateRaw])]));
async function loadAll(){
  if (loading) return;
  loading = true;

  const cache = readCache();
  let fromCache = false;
  KEYS.forEach(k => {
    const c = cache?.data?.[k];
    if (!state.data[k].length && c?.length){ state.data[k] = revive(c); state.status[k] = 'ok'; fromCache = true; }
  });
  if (fromCache) renderAll();
  const before = sig();

  await Promise.all(CONFIG.SECTIONS.map(async s => {
    try {
      const items = await loadSection(s);
      state.data[s.key] = items;
      state.status[s.key] = items.length ? 'ok' : 'empty';
      state.staleAt[s.key] = null;
      if (items.length) writeCache(s.key, items);
    } catch (e){
      console.warn('[송쌤과학] 시트를 읽지 못했습니다:', s.key, e);
      const c = cache?.data?.[s.key];
      if (c?.length){                                        // 1순위: 최근에 성공한 목록
        state.data[s.key] = revive(c);
        state.status[s.key] = 'stale';
        state.staleAt[s.key] = cache.t?.[s.key] ? new Date(cache.t[s.key]) : null;
      } else if (SNAPSHOT[s.key]){                           // 2순위: 내장 스냅샷
        state.data[s.key] = toItems([SNAPSHOT[s.key].headers, ...SNAPSHOT[s.key].rows]);
        state.status[s.key] = 'stale';
        state.staleAt[s.key] = null;
      } else {
        state.data[s.key] = [];
        state.status[s.key] = 'error';
      }
    }
  }));

  state.lastSync = new Date();
  if (sig() !== before) renderAll();

  loading = false;
}
/* 탭을 10분 넘게 떠났다 돌아오면 조용히 한 번 더 읽는다 (시트에 방금 추가한 행도 반영) */
const refreshIfOld = () => { if (state.lastSync && Date.now() - state.lastSync.getTime() > 10 * 60 * 1000) loadAll(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshIfOld(); });
addEventListener('pageshow', e => { if (e.persisted) refreshIfOld(); });

/* 시작 */
readURL();

renderAll();
loadAll();
</script>
</body>
</html>
