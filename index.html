<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>송쌤과학 실험실 · 가상실험실 &amp; 학교 업무 도우미</title>
<meta name="description" content="송쌤과학 가상실험실과 학교 업무 도우미 링크 모음. 구글 시트에 추가한 링크가 자동으로 게시됩니다.">
<meta property="og:title" content="송쌤과학 실험실">
<meta property="og:description" content="중학교 과학 가상실험실과 학교 업무 도우미 모음">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230F6FB8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 3v6.5L4.6 18a2 2 0 0 0 1.7 3h11.4a2 2 0 0 0 1.7-3L14 9.5V3'/%3E%3Cpath d='M8.5 3h7M7.2 14h9.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* ============================================================
   송쌤과학 실험실 허브
   구글 시트를 접속할 때마다 읽어와 카드로 게시합니다.
   시트에 행을 추가하면 이 페이지에 자동 반영됩니다 (재배포 불필요).
   ============================================================ */

:root{
  --paper:#F2F7FC;  --card:#FFFFFF;  --card-2:#E8F0F8;
  --ink:#0E2438;    --ink-2:#33506B; --muted:#6A88A2;
  --line:#D9E5F0;   --line-2:#EDF3F9;
  --blue:#0F6FB8;   --blue-2:#0A5490; --blue-soft:#E5F0FA;
  --pink:#FFB7B2;   --pink-2:#D65E56; --pink-soft:#FFEEEC;
  --grid:rgba(15,111,184,.062);
  --glow-a:rgba(255,183,178,.40); --glow-b:rgba(120,190,240,.22);
  --sh-1:0 1px 2px rgba(14,36,56,.05), 0 6px 14px -8px rgba(14,36,56,.14);
  --sh-2:0 2px 6px rgba(15,111,184,.09), 0 20px 36px -20px rgba(15,111,184,.45);
  --sh-pop:0 30px 70px -22px rgba(8,28,48,.45);
  --yt:#FF0033;  --ig:#D62976;
  --r:15px;
}
[data-theme="dark"]{
  --paper:#0A141E;  --card:#13212E;  --card-2:#0E1B26;
  --ink:#E9F1F8;    --ink-2:#B6CBDD; --muted:#87A1B8;
  --line:#26394C;   --line-2:#1A2734;
  --blue:#5BADEE;   --blue-2:#8BC9F6; --blue-soft:#153348;
  --pink:#FFB7B2;   --pink-2:#FFC9C5; --pink-soft:#3B2A2B;
  --grid:rgba(130,185,235,.05);
  --glow-a:rgba(255,183,178,.10); --glow-b:rgba(60,140,210,.16);
  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 8px 18px -10px rgba(0,0,0,.6);
  --sh-2:0 2px 8px rgba(0,0,0,.35), 0 22px 40px -22px rgba(0,0,0,.8);
  --sh-pop:0 30px 70px -20px rgba(0,0,0,.75);
  --yt:#FF4D6D;  --ig:#F286B4;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.55; letter-spacing:-.012em;
  background-color:var(--paper);
  /* 시그니처: 실험 노트의 모눈종이 */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  transition:background-color .3s, color .3s;
}
body::before{
  content:""; position:fixed; inset:0 0 auto 0; height:560px; z-index:0; pointer-events:none;
  background:
    radial-gradient(680px 300px at 18% -60px, var(--glow-b), transparent 70%),
    radial-gradient(760px 320px at 82% -100px, var(--glow-a), transparent 72%);
}
.wrap{position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:0 20px 70px}
a{color:inherit}
button{font:inherit; color:inherit; background:none; border:none}

/* 아이콘 */
.ico{width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none}
.ico--fill{fill:currentColor; stroke:none}

/* ---------- 상단 바 ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:6px;
  padding:9px 20px; margin:0 -20px;
  background:var(--paper);
  background:color-mix(in srgb, var(--paper) 80%, transparent);
  backdrop-filter:saturate(1.5) blur(12px); -webkit-backdrop-filter:saturate(1.5) blur(12px);
  border-bottom:1px solid transparent;
  transition:border-color .25s, box-shadow .25s;
}
.topbar.is-scrolled{border-bottom-color:var(--line-2); box-shadow:0 6px 20px -14px rgba(14,36,56,.4)}
.brand{display:flex; align-items:center; gap:9px; font-family:Jua,sans-serif; font-size:19px; letter-spacing:.01em}
.brand__mark{
  width:32px; height:32px; border-radius:10px; display:grid; place-items:center; color:#fff;
  background:linear-gradient(140deg, var(--blue), #46A6E4 55%, #7FC3EE);
  box-shadow:0 3px 10px -2px rgba(15,111,184,.5);
}
.brand__mark svg{width:19px; height:19px; overflow:visible}
.brand__mark .liquid{fill:var(--pink); stroke:none}
.brand__mark .bub{fill:#fff; stroke:none; opacity:0}
.brand__mark .b1{animation:bub 2.6s ease-in-out infinite}
.brand__mark .b2{animation:bub 2.6s ease-in-out .9s infinite}
.brand__mark .b3{animation:bub 2.6s ease-in-out 1.7s infinite}
@keyframes bub{
  0%{opacity:0; transform:translateY(0) scale(.6)}
  25%{opacity:.95}
  100%{opacity:0; transform:translateY(-7px) scale(1)}
}
.spacer{flex:1}
.sync{display:flex; align-items:center; gap:7px; padding:0 8px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.sync .dot{width:7px; height:7px; border-radius:50%; background:#35BE8C; box-shadow:0 0 0 3px rgba(53,190,140,.18)}
.sync.is-stale .dot{background:var(--pink-2); box-shadow:0 0 0 3px rgba(214,94,86,.2)}
.div{width:1px; height:20px; background:var(--line); margin:0 4px}

.iconbtn{
  position:relative; display:grid; place-items:center; width:36px; height:36px; border-radius:11px;
  border:1.5px solid var(--line); background:var(--card); color:var(--ink-2); cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.3,1), border-color .18s, color .18s, box-shadow .18s;
}
.iconbtn:hover{transform:translateY(-2px); border-color:var(--blue); color:var(--blue); box-shadow:var(--sh-1)}
.iconbtn:active{transform:translateY(0) scale(.94)}
.iconbtn .ico{font-size:17px}
.iconbtn--yt:hover{border-color:var(--yt); color:var(--yt)}
.iconbtn--ig:hover{border-color:var(--ig); color:var(--ig)}
.iconbtn.is-spinning .ico{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 히어로 ---------- */
.hero{position:relative; padding:52px 4px 34px}
.hero > *{animation:up .6s cubic-bezier(.2,.8,.3,1) backwards}
.hero > *:nth-child(1){animation-delay:.05s}
.hero > *:nth-child(2){animation-delay:.13s}
.hero > *:nth-child(3){animation-delay:.21s}
.hero > *:nth-child(4){animation-delay:.29s}
@keyframes up{from{opacity:0; transform:translateY(14px)}}
.eyebrow{
  display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600;
  color:var(--blue-2); background:var(--blue-soft); border-radius:999px; padding:6px 13px;
  border:1px solid color-mix(in srgb, var(--blue) 18%, transparent);
}
.eyebrow .live{width:6px; height:6px; border-radius:50%; background:var(--blue); animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1; box-shadow:0 0 0 0 color-mix(in srgb, var(--blue) 45%, transparent)}50%{opacity:.45; box-shadow:0 0 0 5px transparent}}
.hero h1{
  font-family:Jua,sans-serif; font-weight:400; font-size:clamp(36px,6.4vw,56px); line-height:1.12;
  margin:16px 0 12px; letter-spacing:.005em;
}
.hero h1 em{font-style:normal; position:relative; color:var(--blue); white-space:nowrap}
.hero h1 em::after{
  content:""; position:absolute; left:-4px; right:-4px; bottom:.05em; height:.32em; z-index:-1;
  background:var(--pink); opacity:.55; border-radius:4px;
  transform:scaleX(0); transform-origin:left center;
  animation:swipe .7s cubic-bezier(.2,.8,.3,1) .5s forwards;
}
@keyframes swipe{to{transform:scaleX(1)}}
.hero p{margin:0; max-width:44ch; color:var(--ink-2); font-size:15.5px}
.stats{display:flex; flex-wrap:wrap; align-items:center; gap:8px 13px; margin-top:22px; font-size:13px; color:var(--muted)}
.stats b{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums}
.stats .sep{display:inline-block; width:3px; height:3px; border-radius:50%; background:var(--muted); opacity:.45}
.hero__art{
  position:absolute; right:-6px; top:22px; width:250px; height:250px; z-index:-1;
  color:var(--blue); opacity:.09; pointer-events:none;
  animation:float 7s ease-in-out infinite;
}
.hero__art svg{width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:.9; stroke-linecap:round; stroke-linejoin:round}
.hero__art .fb{fill:currentColor; stroke:none; opacity:.5}
.hero__art .fb1{animation:rise 4.5s ease-in-out infinite}
.hero__art .fb2{animation:rise 4.5s ease-in-out 1.5s infinite}
.hero__art .fb3{animation:rise 4.5s ease-in-out 3s infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(-2deg)}}
@keyframes rise{0%{opacity:0; transform:translateY(4px) scale(.7)}30%{opacity:.6}100%{opacity:0; transform:translateY(-26px) scale(1.1)}}
@media (max-width:860px){.hero__art{display:none}}

/* ---------- 노트 인덱스 탭 ---------- */
.tabs{display:flex; gap:6px; padding:0 8px; margin-bottom:-1.5px; position:relative; z-index:2}
.tab{
  display:flex; align-items:center; gap:8px; cursor:pointer;
  font-family:Jua,sans-serif; font-size:15.5px; padding:11px 18px 12px;
  border:1.5px solid var(--line); border-radius:14px 14px 0 0;
  background:var(--card-2); color:var(--muted);
  transition:background .2s, color .2s;
}
.tab .ico{font-size:17px; opacity:.75; transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.tab:hover{color:var(--ink)}
.tab:hover .ico{transform:translateY(-2px) rotate(-6deg)}
.tab[aria-selected="true"]{
  background:var(--card); color:var(--ink);
  border-bottom-color:var(--card);           /* 패널과 이어 붙는 노트 탭 */
  box-shadow:inset 0 3px 0 var(--blue);
}
.tab[aria-selected="true"] .ico{color:var(--blue); opacity:1}
.tab .n{
  font-family:"Pretendard Variable",Pretendard,sans-serif; font-size:11.5px; font-weight:700;
  min-width:20px; padding:1px 6px; border-radius:999px;
  background:var(--card); color:var(--muted); font-variant-numeric:tabular-nums;
}
.tab[aria-selected="true"] .n{background:var(--blue); color:#fff}

.panel{
  background:var(--card); border:1.5px solid var(--line);
  border-radius:0 20px 20px 20px; padding:24px; position:relative; z-index:1;
  box-shadow:var(--sh-1);
  animation:panelIn .38s cubic-bezier(.2,.8,.3,1);
}
@keyframes panelIn{from{opacity:0; transform:translateY(6px)}}
.panel[hidden]{display:none}
.panel-head{display:flex; align-items:flex-start; gap:12px; margin-bottom:18px}
.panel-head h2{font-family:Jua,sans-serif; font-weight:400; font-size:22px; margin:0 0 2px}
.panel-head p{margin:0; color:var(--muted); font-size:13.5px}

/* ---------- 도구 모음 ---------- */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px}
.search{position:relative; flex:1 1 230px; min-width:180px; display:flex; align-items:center}
.search .ico{position:absolute; left:12px; font-size:16px; color:var(--muted); pointer-events:none; transition:color .2s}
.search input{
  width:100%; padding:11px 12px 11px 36px; border-radius:12px; font-size:14px;
  border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
  transition:border-color .2s, box-shadow .2s, background .2s;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none; border-color:var(--blue); background:var(--card); box-shadow:0 0 0 4px var(--blue-soft)}
.search:focus-within .ico{color:var(--blue)}
.sort{display:flex; gap:3px; padding:3px; border-radius:12px; background:var(--card-2); border:1.5px solid var(--line)}
.sort button{padding:7px 13px; border-radius:9px; font-size:13px; color:var(--muted); cursor:pointer; transition:background .2s, color .2s, box-shadow .2s}
.sort button[aria-pressed="true"]{background:var(--card); color:var(--ink); font-weight:600; box-shadow:var(--sh-1)}
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px}
.chips-label{font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.03em; margin-right:3px}
.chip{
  border:1.5px solid var(--line); background:var(--paper); color:var(--muted);
  padding:6px 13px; border-radius:999px; font-size:13px; cursor:pointer; white-space:nowrap;
  transition:border-color .18s, color .18s, background .18s, transform .18s;
}
.chip:hover{border-color:var(--blue); color:var(--blue)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; box-shadow:0 4px 12px -4px rgba(15,111,184,.5)}
.count{font-size:12.5px; color:var(--muted); margin:14px 0 12px; font-variant-numeric:tabular-nums}
.count b{color:var(--ink)}

/* ---------- 카드 ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(252px,1fr)); gap:14px}
.grid--still .card{animation:none}

/* 드래그 선택·스크롤바도 브랜드 색으로 */
::selection{background:color-mix(in srgb, var(--pink) 55%, transparent); color:var(--ink)}
html{scrollbar-color:color-mix(in srgb, var(--blue) 45%, var(--line)) transparent; scrollbar-width:thin}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb, var(--blue) 35%, var(--line)); border-radius:99px; border:2.5px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--blue)}
::-webkit-scrollbar-track{background:transparent}

.card{
  position:relative; display:flex; flex-direction:column; gap:11px; overflow:hidden;
  padding:16px 16px 13px 21px; background:var(--card);
  border:1.5px solid var(--line); border-radius:var(--r);
  transition:transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s, border-color .22s;
  animation:cardIn .45s cubic-bezier(.2,.8,.3,1) backwards;
}
@keyframes cardIn{from{opacity:0; transform:translateY(12px) scale(.985)}}
.card::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
  background:var(--tone); transition:width .22s cubic-bezier(.2,.8,.3,1);
}
.card::after{  /* 호버 시 은은한 색 번짐 */
  content:""; position:absolute; right:-40px; top:-40px; width:120px; height:120px; border-radius:50%;
  background:var(--tone); opacity:0; filter:blur(30px); transition:opacity .3s; pointer-events:none;
}
.card:hover{transform:translateY(-4px); border-color:var(--tone); box-shadow:var(--sh-2)}
.card:hover::before{width:9px}
.card:hover::after{opacity:.14}
.card:focus-within{border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-soft)}
.card__top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.card__icon{
  width:38px; height:38px; border-radius:11px; display:grid; place-items:center; flex:none;
  background:var(--tone-bg); color:var(--tone);
  transition:transform .3s cubic-bezier(.2,.8,.3,1);
}
.card__icon .ico{font-size:20px; stroke-width:1.6}
.card:hover .card__icon{transform:rotate(-7deg) scale(1.08)}
.tag{font-size:11.5px; font-weight:600; padding:3.5px 8px; border-radius:7px; white-space:nowrap; line-height:1.35}
.tag--unit{background:var(--tone-bg); color:var(--tone)}
.tag--grade{background:var(--card-2); color:var(--muted)}
.tag--new{
  font-family:Jua,sans-serif; font-weight:400; letter-spacing:.04em;
  background:var(--pink); color:#8A2E28; position:relative; overflow:hidden;
}
[data-theme="dark"] .tag--new{color:#3E1512}
.tag--new::after{
  content:""; position:absolute; inset:0; transform:translateX(-120%);
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent);
  animation:shine 3.4s ease-in-out 1.2s infinite;
}
@keyframes shine{0%{transform:translateX(-120%)}22%,100%{transform:translateX(160%)}}
.card h3{margin:0; font-size:16.5px; font-weight:700; line-height:1.36; letter-spacing:-.02em; word-break:keep-all}
.card h3 a{text-decoration:none; display:inline}
.card h3 a::after{content:""; position:absolute; inset:0; z-index:1}
.card h3 .go{
  font-size:14px; margin-left:4px; vertical-align:-1px; color:var(--tone);
  opacity:0; transform:translateX(-5px); transition:opacity .22s, transform .22s;
}
.card:hover h3 .go{opacity:1; transform:translateX(0)}
.card__foot{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-top:auto; padding-top:10px; border-top:1px dashed var(--line);
}
.date{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; letter-spacing:.02em}
.tools{display:flex; gap:3px; position:relative; z-index:2}
.tool{
  display:grid; place-items:center; width:30px; height:30px; border-radius:9px; cursor:pointer;
  border:1.5px solid transparent; color:var(--muted);
  transition:background .18s, color .18s, border-color .18s, transform .18s;
}
.tool:hover{background:var(--blue-soft); color:var(--blue); border-color:var(--line); transform:translateY(-1px)}
.tool:active{transform:scale(.9)}
.tool .ico{font-size:15px}

/* ---------- 상태 화면 ---------- */
.state{padding:48px 16px; text-align:center; color:var(--muted); animation:up .4s backwards}
.state .badge{
  width:52px; height:52px; margin:0 auto 14px; border-radius:16px; display:grid; place-items:center;
  background:var(--blue-soft); color:var(--blue); font-size:24px;
}
.state h4{margin:0 0 6px; font-family:Jua,sans-serif; font-weight:400; font-size:18px; color:var(--ink)}
.state p{margin:0 auto 16px; max-width:46ch; font-size:13.5px; line-height:1.65}
.state code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; background:var(--card-2); padding:2px 6px; border-radius:6px; color:var(--ink)}
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border-radius:12px; cursor:pointer;
  border:1.5px solid var(--blue); background:var(--blue); color:#fff; font-size:13.5px; font-weight:600;
  transition:transform .18s, box-shadow .18s, filter .18s;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 10px 22px -10px rgba(15,111,184,.7)}
.btn:active{transform:translateY(0) scale(.97)}
.btn--ghost{background:transparent; color:var(--blue); border-color:var(--line)}
.btn--ghost:hover{border-color:var(--blue); box-shadow:var(--sh-1)}
.skeleton{
  height:118px; border-radius:var(--r); border:1.5px solid var(--line-2);
  background:linear-gradient(100deg,var(--card-2) 30%,var(--line-2) 50%,var(--card-2) 70%);
  background-size:220% 100%; animation:shimmer 1.4s linear infinite;
}
@keyframes shimmer{to{background-position:-120% 0}}
.notice{
  display:flex; gap:10px; align-items:flex-start; padding:12px 14px; margin-bottom:16px;
  border-radius:12px; border:1.5px solid var(--pink); background:var(--pink-soft);
  font-size:13px; color:var(--ink); line-height:1.55;
}
.notice .ico{font-size:17px; color:var(--pink-2); margin-top:1px}

/* ---------- 푸터 ---------- */
.foot{margin-top:40px; padding:26px 4px 0; border-top:1px solid var(--line-2)}
.foot__row{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
.foot__brand{display:flex; align-items:center; gap:8px; font-family:Jua,sans-serif; font-size:15px}
.foot__brand .ico{font-size:18px; color:var(--blue)}
.sns{
  display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:12px;
  border:1.5px solid var(--line); background:var(--card); font-size:13.5px; font-weight:600;
  text-decoration:none; color:var(--ink-2);
  transition:transform .2s cubic-bezier(.2,.8,.3,1), color .2s, border-color .2s, box-shadow .2s;
}
.sns .ico{font-size:17px}
.sns:hover{transform:translateY(-2px); box-shadow:var(--sh-1)}
.sns--yt:hover{color:var(--yt); border-color:var(--yt)}
.sns--ig:hover{color:var(--ig); border-color:var(--ig)}
.sns--link:hover{color:var(--blue); border-color:var(--blue)}
.foot__note{margin:18px 0 0; font-size:12px; color:var(--muted)}

/* ---------- 모달 / 토스트 ---------- */
.overlay{
  position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:20px;
  background:rgba(8,26,44,.55); backdrop-filter:blur(4px); animation:fade .2s ease;
}
.overlay[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.modal{
  background:var(--card); border:1.5px solid var(--line); border-radius:22px; padding:26px;
  width:min(344px,100%); text-align:center; box-shadow:var(--sh-pop);
  animation:pop .28s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{from{opacity:0; transform:scale(.92) translateY(10px)}}
.modal h4{margin:0 0 3px; font-size:16.5px; font-weight:700; word-break:keep-all}
.modal .sub{margin:0 0 18px; font-size:12px; color:var(--muted)}
#qrbox{display:grid; place-items:center; padding:14px; background:#fff; border-radius:14px; margin-bottom:14px; border:1.5px solid var(--line)}
#qrbox img,#qrbox canvas{display:block}
.modal .url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--muted); word-break:break-all; margin-bottom:16px; line-height:1.45}
.toast{
  position:fixed; left:50%; bottom:28px; z-index:70; display:flex; align-items:center; gap:8px;
  transform:translateX(-50%) translateY(16px); opacity:0; pointer-events:none;
  background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:999px;
  font-size:13.5px; font-weight:600; box-shadow:var(--sh-pop);
  transition:opacity .25s, transform .25s cubic-bezier(.2,.9,.3,1);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.toast .ico{font-size:16px; color:#7FE3B8}

:focus-visible{outline:2.5px solid var(--blue); outline-offset:2px; border-radius:8px}

@media (max-width:640px){
  .wrap{padding:0 14px 52px}
  .topbar{padding:8px 14px; margin:0 -14px; gap:4px}
  .brand{font-size:17px}
  .sync,.div{display:none}
  .iconbtn{width:34px; height:34px; border-radius:10px}
  .hero{padding:34px 2px 24px}
  .panel{padding:16px; border-radius:0 16px 16px 16px}
  .tab{padding:10px 13px; font-size:14px; gap:6px}
  .grid{grid-template-columns:1fr}
  .foot__row{gap:8px}
  .sns{flex:1; justify-content:center; padding:10px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
  .hero h1 em::after{transform:scaleX(1)}
}
</style>

function endpoints(section){
  const id = CONFIG.SHEET_ID, rid = Date.now(), list = [];
  if (section.publishedCsv) list.push(section.publishedCsv + (section.publishedCsv.includes('?') ? '&' : '?') + 'r=' + rid);
  // gid를 먼저 씁니다 — 탭 "이름"으로 요청하면 이름이 어긋났을 때
  // 구글이 오류 대신 첫 번째 탭을 돌려줘서 엉뚱한 목록이 섞일 수 있습니다
  if (section.gid) list.push(
    `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv;reqId:${rid}&gid=${section.gid}`
  );
  section.tabs.forEach(t => list.push(
    `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv;reqId:${rid}&sheet=${encodeURIComponent(t)}`
  ));
  return list;
}

/* 8초 안에 응답이 없으면 끊습니다 — 느린 회선에서 스켈레톤이 멈춰 있지 않도록 */
function fetchTimeout(url, ms = 8000){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { cache:'no-store', signal:ctrl.signal }).finally(() => clearTimeout(timer));
}

async function loadSection(section){
  let fetched = false, lastErr = null;
  for (const url of endpoints(section)){
    try {
      const res = await fetchTimeout(url);
      if (!res.ok) { lastErr = new Error('HTTP ' + res.status); continue; }
      const text = await res.text();
      if (!text || /^\s*</.test(text)) { lastErr = new Error('CSV 아님'); continue; }  // 오류 페이지(HTML)
      const table = parseCSV(text);
      // 머리글 검사 — 다른 탭의 표가 돌아오면 받아들이지 않고 다음 주소를 시도합니다
      const head = (table[0] || []).join(' ');
      if (section.expectHead && !section.expectHead.test(head)){
        lastErr = new Error('다른 탭 데이터(머리글 불일치): ' + head.slice(0, 40));
        continue;
      }
      fetched = true;
      const items = toItems(table);
      if (items.length) return items;
    } catch (e) { lastErr = e; }
  }
  if (fetched) return [];                    // 탭은 읽었는데 아직 비어 있음
  throw lastErr || new Error('시트를 읽지 못했습니다');
}

/* CSV 파서 (따옴표·줄바꿈 포함 셀 지원) */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  const s = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){
      if (c === '"'){ if (s[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else {
      if (c === '"') q = true;
      else if (c === ','){ row.push(cell); cell = ''; }
      else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}

/* 표 → 카드 데이터 (머리글 이름이 달라도 자동으로 알아봅니다) */
function toItems(table){
  if (!table.length) return [];
  const isUrl = v => /^https?:\/\//i.test(String(v).trim());
  const head = table[0].map(v => String(v).trim());
  const headerless = head.some(isUrl);
  const body = headerless ? table : table.slice(1);
  const map = headerless ? guessColumns(body) : mapColumns(head, body);
  if (map.url < 0) return [];

  return body.map(r => {
    const get = i => (i >= 0 && r[i] != null) ? String(r[i]).trim() : '';
    const url = get(map.url);
    if (!isUrl(url)) return null;
    const raw = get(map.date);
    return {
      grade: get(map.grade),
      group: get(map.group),
      title: get(map.title) || url.replace(/^https?:\/\//,'').replace(/\/$/,''),
      url, date: parseDate(raw)
    };
  }).filter(Boolean);
}

function mapColumns(head, body){
  const norm = h => h.replace(/\s/g,'').toLowerCase();
  const find = keys => head.findIndex(h => keys.some(k => norm(h).includes(k)));
  const map = {
    grade: find(['학년','대상']),
    group: find(['단원','분류','카테고리','영역','구분','종류']),
    title: find(['실험명','도구','제목','이름','명칭','프로그램','자료','사이트','앱']),
    url:   find(['주소','링크','url','link']),
    date:  find(['편집일','날짜','수정','등록','업데이트','작성'])
  };
  if (map.url < 0){                       // 머리글이 달라도 값의 생김새로 찾기
    const g = guessColumns(body);
    map.url = g.url;
    if (map.title < 0) map.title = g.title;
    if (map.group < 0) map.group = g.group;
    if (map.date  < 0) map.date  = g.date;
    if (map.grade < 0) map.grade = g.grade;
  }
  if (map.title < 0){                     // 남은 열 중 첫 번째를 이름으로
    for (let i = 0; i < head.length; i++){
      if (i === map.url || i === map.date || i === map.grade || i === map.group) continue;
      map.title = i; break;
    }
  }
  return map;
}

function guessColumns(body){
  const cols = Math.max(...body.map(r => r.length), 0);
  const col = i => body.map(r => String(r[i] ?? '').trim());
  const ratio = (i, re) => { const v = col(i).filter(Boolean); return v.length ? v.filter(x => re.test(x)).length / v.length : 0; };
  const map = { grade:-1, group:-1, title:-1, url:-1, date:-1 };
  for (let i = 0; i < cols; i++){
    if (map.url   < 0 && ratio(i, /^https?:\/\//i) > .6) { map.url = i; continue; }
    if (map.date  < 0 && ratio(i, /\d{4}\D+\d{1,2}\D+\d{1,2}/) > .6) { map.date = i; continue; }
    if (map.grade < 0 && ratio(i, /^(중|고|초)\s?\d/) > .6) { map.grade = i; continue; }
  }
  const rest = [];
  for (let i = 0; i < cols; i++){
    if (i === map.url || i === map.date || i === map.grade) continue;
    const v = col(i).filter(Boolean);
    if (v.length) rest.push({ i, uniq: new Set(v).size });
  }
  rest.sort((a,b) => a.uniq - b.uniq);
  if (rest.length === 1) map.title = rest[0].i;
  else if (rest.length >= 2){ map.group = rest[0].i; map.title = rest[rest.length-1].i; }
  return map;
}

function parseDate(v){
  const m = String(v || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d) ? null : d;
}
const fmt   = d => d ? `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}` : '';
const isNew = d => d && (Date.now() - d.getTime()) < CONFIG.NEW_DAYS * 864e5;

/* 내용에 맞는 색·아이콘 고르기 */
function styleOf(item, key){
  const text = `${item.group} ${item.title}`;
  const hit = RULES.find(r => r.re.test(text));
  return hit || FALLBACK[key];
}
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16 & 255}, ${n>>8 & 255}, ${n & 255}, ${a})`;
}

/* 검색할 때는 결과만 다시 그립니다 (한글 입력이 끊기지 않도록) */
function renderResults(key, animate = true){
  const box = $('#results-' + key);
  if (!box) return;
  const f = state.filter[key];
  const items = state.data[key];
  const q = f.q.trim().toLowerCase();

  const list = items.filter(i =>
    (!f.grade || i.grade === f.grade) &&
    (!f.group || i.group === f.group) &&
    (!q || `${i.title} ${i.group} ${i.grade}`.toLowerCase().includes(q))
  );
  list.sort((a, b) => f.sort === 'recent'
    ? (b.date?.getTime() || 0) - (a.date?.getTime() || 0)
    : (a.grade + a.group).localeCompare(b.grade + b.group, 'ko') || a.title.localeCompare(b.title, 'ko'));

  let html = `<p class="count">${items.length}개 중 <b>${list.length}개</b> 보는 중</p>`;

  if (!list.length){
    html += `<div class="state">
        <div class="badge">${icon('i-search')}</div>
        <h4>찾는 자료가 없어요</h4>
        <p>다른 낱말로 찾거나 필터를 지워 보세요.</p>
        <button class="btn btn--ghost" data-reset="${key}">필터 지우기</button>
      </div>`;
  } else {
    html += `<div class="grid${animate ? '' : ' grid--still'}">` + list.map((i, n) => {
      const s = styleOf(i, key);
      return `<article class="card" style="--tone:${s.tone}; --tone-bg:${rgba(s.tone,.13)}; animation-delay:${Math.min(n,12)*40}ms">
        <div class="card__top">
          <span class="card__icon">${icon(s.icon)}</span>
          ${i.grade ? `<span class="tag tag--grade">${esc(i.grade)}</span>` : ''}
          ${i.group ? `<span class="tag tag--unit">${esc(i.group)}</span>` : ''}
          ${isNew(i.date) ? `<span class="tag tag--new">NEW</span>` : ''}
        </div>
        <h3><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}${icon('i-arrow','go')}</a></h3>
        <div class="card__foot">
          <time class="date">${i.date ? fmt(i.date) : ''}</time>
          <span class="tools">
            <button class="tool" data-copy="${esc(i.url)}" title="링크 복사" aria-label="${esc(i.title)} 링크 복사">${icon('i-copy')}</button>
            <button class="tool qr-btn" data-qr="${esc(i.url)}" data-title="${esc(i.title)}" title="QR 코드" aria-label="${esc(i.title)} QR 코드">${icon('i-qr')}</button>
          </span>
        </div>
      </article>`;
    }).join('') + `</div>`;
  }

  box.innerHTML = html;
  if (typeof QRCode === 'undefined') $$('.qr-btn', box).forEach(b => b.remove());
}

/* 숫자 세기 애니메이션 */
function countUp(el, to){
  const from = Number(el.dataset.num) || 0;
  if (from === to){ el.textContent = to || '–'; return; }
  el.dataset.num = to;
  const t0 = performance.now(), dur = 700;
  const step = t => {
    const p = Math.min((t - t0) / dur, 1);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function renderStats(){
  const lab = state.data.lab.length, work = state.data.work.length;
  const all = [...state.data.lab, ...state.data.work].map(i => i.date).filter(Boolean);
  const last = all.length ? new Date(Math.max(...all.map(d => d.getTime()))) : null;

  const nums = $$('#stats b');
  countUp(nums[0], lab);
  countUp(nums[1], work);
  nums[2].textContent = last ? fmt(last) : '–';
  $('#n-lab').textContent  = lab  || '·';
  $('#n-work').textContent = work || '·';

  const broken = Object.values(state.status).some(s => s === 'stale' || s === 'error');
  const sync = $('#sync');
  sync.classList.toggle('is-stale', broken);
  const t = state.lastSync;
  sync.innerHTML = `<span class="dot"></span><span>${
    broken ? '시트 연결 안 됨'
           : (t ? `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} 기준` : '불러오는 중')
  }</span>`;
}

/* ============================================================
   6) 불러오기 / 새로고침
   ============================================================ */
/* ------------------------------------------------------------
   최근 성공 데이터 캐시 (있으면 즉시 보여주고, 뒤에서 시트를 새로 읽습니다)
   - 재방문 시 첫 화면이 바로 뜨고, 시트를 못 읽어도 최근 목록을 유지합니다
   - 저장이 막힌 브라우저(시크릿 모드 등)에서는 조용히 건너뜁니다
   ------------------------------------------------------------ */
const CACHE_KEY = 'songsam-hub-v2';   // v1에 잘못 섞여 저장된 목록을 버리기 위해 버전 올림
function readCache(){
  try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || null; } catch { return null; }
}
function writeCache(key, items){
  try {
    const c = readCache() || { t:{}, data:{} };
    c.t[key] = Date.now();
    c.data[key] = items.map(i => ({ grade:i.grade, group:i.group, title:i.title, url:i.url, dateRaw:i.dateRaw }));
    localStorage.setItem(CACHE_KEY, JSON.stringify(c));
  } catch { /* 저장 불가 환경 — 무시 */ }
}
function reviveCache(rows){
  return rows.map(r => ({ ...r, date: parseDate(r.dateRaw) }));
}

let loading = false;
async function loadAll(){
  if (loading) return;                 // 새로고침 연타 방지
  loading = true;
  const btn = $('#refresh');
  btn.classList.add('is-spinning');
  $('#sync').innerHTML = `<span class="dot"></span><span>시트 확인 중</span>`;
  $('#sync').classList.remove('is-stale');

  // 캐시가 있으면 스켈레톤 대신 최근 목록을 먼저 보여줍니다
  const cache = readCache();
  CONFIG.SECTIONS.forEach(s => {
    const cached = cache?.data?.[s.key];
    if (cached?.length){
      state.data[s.key] = reviveCache(cached);
      state.status[s.key] = 'ok';
    } else {
      state.status[s.key] = 'loading';
    }
    render(s.key);
  });

  await Promise.all(CONFIG.SECTIONS.map(async s => {
    try {
      state.data[s.key]   = await loadSection(s);
      state.status[s.key] = state.data[s.key].length ? 'ok' : 'empty';
      if (state.data[s.key].length) writeCache(s.key, state.data[s.key]);
      state.staleAt[s.key] = null;
    } catch (e) {
      const cached = cache?.data?.[s.key];
      if (cached?.length){             // 1순위: 최근 성공 데이터
        state.data[s.key]   = reviveCache(cached);
        state.status[s.key] = 'stale';
        state.staleAt[s.key] = cache.t?.[s.key] ? new Date(cache.t[s.key]) : null;
      } else if (SNAPSHOT[s.key]){     // 2순위: 내장 스냅샷
        state.data[s.key]   = toItems([SNAPSHOT[s.key].headers, ...SNAPSHOT[s.key].rows]);
        state.status[s.key] = 'stale';
        state.staleAt[s.key] = null;
      } else {
        state.data[s.key]   = [];
        state.status[s.key] = 'error';
      }
    }
    render(s.key);
  }));

  state.lastSync = new Date();
  renderStats();
  btn.classList.remove('is-spinning');
  loading = false;
}

/* 탭을 오래 벗어났다가 돌아오면 조용히 한 번 갱신 (10분 기준) */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' &&
      state.lastSync && Date.now() - state.lastSync.getTime() > 10 * 60 * 1000){
    loadAll();
  }
});

/* ============================================================
   7) 이벤트
   ============================================================ */
function switchTab(key){
  if (state.active === key) return;
  state.active = key;
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.key === key)));
  CONFIG.SECTIONS.forEach(s => {
    const p = $('#panel-' + s.key);
    p.hidden = (s.key !== key);
    if (s.key === key){                       // 패널 전환 애니메이션 다시 재생
      p.style.animation = 'none';
      void p.offsetWidth;
      p.style.animation = '';
    }
  });
}

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) return switchTab(tab.dataset.key);

  if (e.target.closest('[data-retry]')) return loadAll();

  const reset = e.target.closest('[data-reset]');
  if (reset){
    const k = reset.dataset.reset;
    state.filter[k] = { q:'', grade:'', group:'', sort:state.filter[k].sort };
    return render(k);
  }
  const grade = e.target.closest('[data-grade]');
  if (grade){
    const k = grade.dataset.key;
    state.filter[k].grade = grade.dataset.grade;
    state.filter[k].group = '';
    return render(k);
  }
  const group = e.target.closest('[data-group]');
  if (group){
    const k = group.dataset.key;
    state.filter[k].group = group.dataset.group;
    return render(k);
  }
  const sort = e.target.closest('[data-sort]');
  if (sort){
    const k = sort.dataset.key;
    state.filter[k].sort = sort.dataset.sort;
    return render(k);
  }
  const copy = e.target.closest('[data-copy]');
  if (copy) return copyLink(copy.dataset.copy);

  const qr = e.target.closest('[data-qr]');
  if (qr) return openQR(qr.dataset.qr, qr.dataset.title);
});

document.addEventListener('input', e => {
  const q = e.target.closest('[data-q]');
  if (!q) return;
  state.filter[q.dataset.q].q = q.value;
  renderResults(q.dataset.q, false);   // 타이핑 중엔 카드 등장 애니메이션 생략
});

$('#refresh').addEventListener('click', loadAll);

$('#theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  setTheme(dark ? 'light' : 'dark');
});
function setTheme(mode){
  document.documentElement.dataset.theme = mode;
  $('#theme-use').setAttribute('href', mode === 'dark' ? '#i-moon' : '#i-sun');
}

const topbar = $('#topbar');
addEventListener('scroll', () => topbar.classList.toggle('is-scrolled', scrollY > 6), { passive:true });

/* 링크 복사 */
function copyLink(url){
  const done = () => toast('링크를 복사했어요');
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
  else fallbackCopy(url, done);
}
function fallbackCopy(url, done){
  const ta = document.createElement('textarea');
  ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('복사하지 못했어요'); }
  ta.remove();
}

/* QR */
function openQR(url, title){
  if (typeof QRCode === 'undefined') return copyLink(url);
  $('#qr-title').textContent = title;
  $('#qr-url').textContent = url;
  const box = $('#qrbox'); box.innerHTML = '';
  new QRCode(box, { text:url, width:196, height:196, colorDark:'#0E2438', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
  $('#qr-overlay').hidden = false;
  $('#qr-close').focus();
}
function closeQR(){ $('#qr-overlay').hidden = true; }
$('#qr-close').addEventListener('click', closeQR);
$('#qr-overlay').addEventListener('click', e => { if (e.target.id === 'qr-overlay') closeQR(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeQR(); });

/* 토스트 */
let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.innerHTML = `<svg class="ico"><use href="#i-done"></use></svg>${esc(msg)}`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* 시작 */
if (matchMedia?.('(prefers-color-scheme: dark)').matches) setTheme('dark');
loadAll();
</script>
